name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar proyecto
        run: |
          if [ -f AutoLauncherMX.zip ]; then unzip -oq AutoLauncherMX.zip; fi
          if [ -d AutoLauncherMX ]; then echo "DIR=AutoLauncherMX" >> $GITHUB_ENV; else echo "DIR=." >> $GITHUB_ENV; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AutoLauncherMX-debug
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
